#menu .menu-content{width:min(760px,calc(100vw - 64px));max-width:760px;margin:clamp(88px,12vh,132px) 0 36px clamp(20px,7vw,110px);padding:clamp(22px,3vw,38px);border:1px solid rgba(220,239,226,.12);border-radius:18px;background:linear-gradient(145deg,rgba(8,22,20,.94),rgba(12,25,23,.82));box-shadow:0 24px 80px rgba(0,0,0,.32);backdrop-filter:blur(16px)}
#menu .eyebrow{font-size:clamp(10px,1.1vw,12px);letter-spacing:.22em;margin:0 0 18px;line-height:1.5}
#menu .menu-content h1{font-size:clamp(48px,6vw,78px);line-height:1.02;letter-spacing:-.055em;margin:0 0 16px;overflow-wrap:normal}
#menu .intro{max-width:55ch;font-size:clamp(13px,1.35vw,15px);line-height:1.7;margin:0 0 22px}
#menu .mode-grid{width:100%;max-width:100%;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 18px}
#menu .mode-grid button{min-width:0;min-height:76px;padding:13px 15px;border-radius:10px;gap:12px}
#menu .mode-grid button>span{min-width:0;font-size:14px;line-height:1.25;overflow-wrap:anywhere}
#menu .mode-grid button small{font-size:11px;line-height:1.35;white-space:normal}
#menu .mode-grid button>b{flex:0 0 34px;width:34px;height:34px;font-size:14px}
#menu .cue-picker{width:100%;max-width:100%;margin:18px 0}
#menu .cue-picker-head{align-items:center;flex-wrap:wrap}
#menu .cue-picker-head b{font-size:11px;letter-spacing:.16em}
#menu .cue-picker-head span{font-size:11px;line-height:1.4}
#menu .cue-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
#menu .cue-card{min-width:0;padding:12px;border-radius:11px;overflow:hidden}
#menu .cue-card h3{font-size:14px;line-height:1.3;overflow-wrap:anywhere}
#menu .cue-card p{font-size:11px;line-height:1.45;min-height:0;overflow-wrap:anywhere}
#menu .cue-stats{gap:6px}
#menu .play{width:100%;max-width:100%;min-height:56px;border-radius:10px;font-size:15px;padding:16px 20px}
#menu .menu-note{font-size:10px;line-height:1.6;letter-spacing:.12em;margin-top:16px}
#menu .menu-signature{display:none}
@media(max-width:760px){
 header{padding-left:14px;padding-right:14px}
 #menu.menu{background:linear-gradient(180deg,rgba(8,18,18,.96),rgba(8,18,18,.88))}
 #menu .menu-content{width:calc(100vw - 28px);margin:82px 14px 24px;padding:20px;border-radius:15px}
 #menu .menu-content h1{font-size:clamp(43px,10vw,64px);letter-spacing:-.05em}
 #menu .intro{font-size:13px;line-height:1.65;margin-bottom:18px}
 #menu .mode-grid{gap:8px}
 #menu .mode-grid button{min-height:72px;padding:10px;gap:8px}
 #menu .mode-grid button>span{font-size:13px}
 #menu .mode-grid button small{font-size:10px}
 #menu .cue-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 #menu .cue-card{padding:10px;gap:7px}
 #menu .cue-card p{font-size:10px}
 #menu .cue-art{height:48px}
 #menu .cue-art svg{height:44px}
 #menu .menu-note{font-size:9px}
}
@media(max-width:390px){
 #menu .menu-content{width:calc(100vw - 20px);margin:76px 10px 20px;padding:16px}
 #menu .mode-grid{grid-template-columns:1fr}
 #menu .mode-grid button{min-height:62px}
 #menu .cue-grid{grid-template-columns:1fr}
 #menu .cue-card{display:grid;grid-template-columns:92px minmax(0,1fr);column-gap:10px;align-items:center}
 #menu .cue-art{grid-row:span 3;width:92px;height:58px}

/* Chris Club mobile and accessibility refinement */
@media (max-width:760px){
  html,body{min-height:100%;overflow:hidden}
  header{padding:10px 12px;gap:8px}
  header nav{gap:5px}
  header nav button{min-width:38px;min-height:38px;padding:8px}
  header nav button span{display:none}
  .topcenter{max-width:38vw;font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .brand small{display:none}
  #hud{padding:0 10px 10px}
  .scoreboard{top:66px;left:10px;right:10px;width:auto}
  .camera-bar{top:auto;bottom:calc(env(safe-area-inset-bottom) + 132px);left:50%;transform:translateX(-50%);max-width:calc(100vw - 16px);overflow-x:auto;white-space:nowrap}
  .camera-bar button{min-width:38px;min-height:38px}
  .bottom-area{left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);gap:8px}
  .utility{justify-content:center;flex-wrap:wrap;gap:5px}
  .utility button,.utility select{min-height:36px;padding:7px 9px;font-size:11px}
  .shot-desk{width:100%;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:10px}
  .spin-module,.power-module,.shot-module{min-width:0}
  .spin-row{gap:10px}
  #spinPad{width:min(31vw,112px);height:min(31vw,112px);flex:0 0 auto}
  .spin-caption{min-width:0}
  .spin-caption label{font-size:10px}
  .power-module input[type=range]{width:100%}
  .shot-module{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end}
  #calls{grid-column:1/-1}
  #shootBtn{min-width:112px;min-height:44px}
  footer{display:none}
  .menu-content{max-height:calc(100dvh - 30px);overflow-y:auto;overscroll-behavior:contain}
  .menu-signature{display:none}
}
@media (max-width:420px){
  .scoreboard{padding:8px}
  .player-id{display:none}
  .versus{padding:0 5px}
  .shot-desk{border-radius:13px}
  .spin-caption output{font-size:10px}
  .aim-help{font-size:9px;line-height:1.3}
  .shot-module{grid-template-columns:1fr}
  #shootBtn{width:100%}
}
@media (orientation:portrait) and (max-width:760px){
  #viewport{inset:0}
  .camera-bar{bottom:calc(env(safe-area-inset-bottom) + 158px)}
  .bottom-area{bottom:calc(env(safe-area-inset-bottom) + 7px)}
}

button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #d5b477;outline-offset:3px}
