services:
  - type: web
    name: chris-club-online
    runtime: node
    buildCommand: pnpm install --frozen-lockfile
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DISCONNECT_GRACE_MS
        value: "45000"
      - key: ALLOWED_ORIGINS
        sync: false
